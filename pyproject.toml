[project]
name = "ai-help-desk-governed-access"
version = "0.1.0"
description = "AI helpdesk with governed access"
requires-python = ">=3.12"
dependencies = [
    "helpdesk",
    "agent-api",
    "mcp-server",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    # Pinned exactly: seeded Faker output must not drift between versions
    #.
    "faker==40.38.0",
]

[dependency-groups]
dev = [
    "ruff>=0.12",
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pre-commit>=4.0",
    "httpx>=0.28",
]

[tool.uv.workspace]
members = ["packages/helpdesk", "services/agent-api", "services/mcp-server"]

[tool.uv.sources]
helpdesk = { workspace = true }
agent-api = { workspace = true }
mcp-server = { workspace = true }

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# Report unused imports but never auto-delete them: the format hook runs after
# every edit, and autofix kept stripping imports added one edit before their
# first usage (the project notes 2026-09-03 and 2026-09-04).
unfixable = ["F401"]

[tool.mypy]
strict = true
files = ["packages", "services", "scripts"]

# Settings(_env_file=None) is valid at runtime; mypy's synthesized pydantic
# __init__ rejects it. Scoped to the settings tests only.
[[tool.mypy.overrides]]
module = "test_settings"
disable_error_code = ["call-arg"]

[tool.pytest.ini_options]
testpaths = [
    "packages/helpdesk/tests",
    "services/agent-api/tests",
    "services/mcp-server/tests",
]
addopts = "-q"

[tool.coverage.run]
source = ["helpdesk", "agent_api", "mcp_server"]
# SQLAlchemy async drives queries through greenlets; without this, coverage
# loses the trace in any coroutine after its first awaited DB call.
concurrency = ["greenlet"]

[tool.coverage.report]
show_missing = true
