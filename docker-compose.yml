# Two stacks in one file, separated by a profile.
#
#   docker compose up -d                  the backing services alone (and the
#                                         test suite's own Postgres)
#   docker compose --profile app up -d    those plus the four containers
#
# The bare command is the one every test suite, `make run` and `make migrate`
# depend on, so postgres, redis and qdrant carry NO profile: a profile on any
# of them makes the bare command start nothing at all, and every host-run
# service loses its database with no error naming the cause. Pinned by
# infra/tests/test_container_build.py::
# test_the_backing_services_carry_no_profile.
#
# The four app services carry `build:` and no `image:` on purpose. The
# weekly scan is pinned to the exact set of `image:` values here, and a built
# image that named one would add a fourth name to that set for an image no
# registry holds.
#
# No .env sits at the repo root. Every ${...} below carries a default equal to
# its line in backend/.env.demo (local-only demo values, never a real
# credential; infra/tests/test_root_cleanup.py keeps the two equal). The app
# services load backend/.env.demo, then backend/.env over it (only the real
# keys), both optional. They then override every variable whose value names
# `localhost`: inside this network the hostname of a backing service is its
# service name, and a container that read the host spelling would dial its own
# loopback and find nothing.
services:
  postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-helpdesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-helpdesk}
      # Read by the init script below, never by a service. The restricted role
      # exists so that a compromised service cannot rewrite the audit log; the
      # owner credentials above stay with Alembic and the test suite.
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-m2n_IzBnZTPtYshdudXUt4J-kBZuPJby}
    ports: ["5432:5432"]
    volumes:
      - "pgdata:/var/lib/postgresql/data"
      # Runs only when pgdata is empty, which is why it owns the PASSWORD and
      # nothing else: the Alembic migration owns the role's existence and every
      # grant, so a database that already exists is not silently left ungranted
      #. The .sql is mounted outside the init directory
      # because the entrypoint would otherwise run it a second time itself,
      # with no password variable set.
      - "./infra/local/postgres/init-app-role.sh:/docker-entrypoint-initdb.d/init-app-role.sh:ro"
      - "./infra/local/postgres/init-app-role.sql:/etc/helpdesk/init-app-role.sql:ro"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The test suite's own server. Postgres roles belong to the whole server,
  # so a test that changes `helpdesk_app`'s password on `postgres` would break
  # the running app's login. Same image (the pinned image set does not move),
  # loopback only, data in memory (a clean server on every start), no init
  # script, plain test values no env file reads. `cluster_name` lets the suite
  # check it reached this server, never the app's. Pinned by
  # infra/tests/test_test_postgres.py.
  postgres-test:
    image: postgres:16.6-alpine
    command: ["postgres", "-c", "cluster_name=helpdesk-test"]
    environment:
      POSTGRES_USER: helpdesk
      POSTGRES_PASSWORD: change-me
      POSTGRES_DB: helpdesk_test
    ports: ["127.0.0.1:5433:5432"]
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helpdesk -d helpdesk_test"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.19.1
    ports: ["6333:6333"]
    volumes: ["qdrantdata:/qdrant/storage"]
    healthcheck:
      # The qdrant image ships no curl/wget; probe the TCP port via bash.
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  helpdesk-agent-api:
    profiles: ["app"]
    build:
      context: ./backend
      dockerfile: Dockerfile.agent-api
    env_file:
      - {path: backend/.env.demo, required: false}
      - {path: backend/.env, required: false}
    environment:
      DATABASE_URL: postgresql+asyncpg://helpdesk_app:${APP_DB_PASSWORD:-m2n_IzBnZTPtYshdudXUt4J-kBZuPJby}@postgres:5432/${POSTGRES_DB:-helpdesk}
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      MCP_URL: http://helpdesk-mcp-server:8081/mcp
      WEB_ORIGIN: http://localhost:3000
      # The one localhost variable whose target is NOT on this network: the
      # model gateway is the companion console's service, run separately. Left
      # to `backend/.env.demo` it would arrive as `http://localhost:8080/v1` and this
      # container would dial its own loopback, so `/readyz` reported unready
      # with a gateway running the whole time. `host.docker.internal`
      # is the host as seen from inside, which is where 8080 is published.
      # A gateway somewhere else is pointed at through
      # docker-compose.override.example.yml, not by editing this line.
      GATEWAY_URL: ${GATEWAY_URL_IN_COMPOSE:-http://host.docker.internal:8080/v1}
    extra_hosts:
      # Linux does not resolve host.docker.internal on its own; Docker Desktop
      # does. Declaring it here makes the name mean the same thing on both.
      - "host.docker.internal:host-gateway"
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      qdrant: {condition: service_healthy}
    healthcheck:
      # /healthz, never /readyz: readiness is 503 wherever no gateway answers,
      # so a readiness-based healthcheck would hold this container
      # unhealthy on a machine with no gateway and stop web from ever starting.
      # The image ships no curl, so the probe is the interpreter already in it.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz').read()"]
      interval: 5s
      timeout: 3s
      retries: 10

  helpdesk-mcp-server:
    profiles: ["app"]
    build:
      context: ./backend
      dockerfile: Dockerfile.mcp-server
    env_file:
      - {path: backend/.env.demo, required: false}
      - {path: backend/.env, required: false}
    environment:
      DATABASE_URL: postgresql+asyncpg://helpdesk_app:${APP_DB_PASSWORD:-m2n_IzBnZTPtYshdudXUt4J-kBZuPJby}@postgres:5432/${POSTGRES_DB:-helpdesk}
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      POLICY_DIR: /srv/policies
    volumes:
      # Read-only, and mounted rather than baked in: a compromised tool process
      # must not be able to edit the corpus that decides access, and the corpus
      # must not be pinned to a build.
      #
      # The host side is written `./backend/data/policies` and not
      # `${POLICY_DIR}`. A bind mount's source has to start with `.` or `/` or
      # compose reads it as a NAMED VOLUME, and backend/.env.demo ships POLICY_DIR as a bare
      # relative path -- which would silently mount an empty volume and ingest
      # zero chunks. A corpus kept elsewhere is mounted through
      # docker-compose.override.example.yml, not by editing this line.
      - "./backend/data/policies:/srv/policies:ro"
    ports: ["8081:8081"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      qdrant: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/healthz').read()"]
      interval: 5s
      timeout: 3s
      retries: 10

  helpdesk-scheduler:
    profiles: ["app"]
    build:
      context: ./backend
      dockerfile: Dockerfile.scheduler
    env_file:
      - {path: backend/.env.demo, required: false}
      - {path: backend/.env, required: false}
    environment:
      DATABASE_URL: postgresql+asyncpg://helpdesk_app:${APP_DB_PASSWORD:-m2n_IzBnZTPtYshdudXUt4J-kBZuPJby}@postgres:5432/${POSTGRES_DB:-helpdesk}
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      MCP_URL: http://helpdesk-mcp-server:8081/mcp
    # Published because the loop's counters can only be scraped here (a metric
    # nothing can reach is not a metric).
    ports: ["8082:8082"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8082/healthz').read()"]
      interval: 5s
      timeout: 3s
      retries: 10

  helpdesk-web:
    profiles: ["app"]
    build:
      context: web
    environment:
      # The server side alone talks to agent-api, so this is a network-internal
      # name and never reaches a browser.
      AGENT_API_URL: http://helpdesk-agent-api:8000
      # Plain http on the compose network, so the cookie cannot carry Secure or
      # no session survives a login here.
      SESSION_COOKIE_SECURE: "false"
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    ports: ["3000:3000"]
    depends_on:
      helpdesk-agent-api: {condition: service_started}
    healthcheck:
      # The node image ships no curl either, and this probe is liveness: it must
      # not fail because agent-api is down, which is what /readyz is for.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  qdrantdata:
