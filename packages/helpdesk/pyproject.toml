[project]
name = "helpdesk"
version = "0.1.0"
description = "Shared helpdesk library: policy, models, rag, audit, auth, idempotency, killswitch"
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi>=25.1.0",
    "pydantic-settings>=2.6",
    "pyjwt>=2.9",
    "redis>=5.2",
    "sqlalchemy[asyncio]>=2.0",
]

[build-system]
requires = ["uv_build>=0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "helpdesk"
module-root = ""
