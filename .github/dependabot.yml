# Dependabot watches the three manifests this repo actually has: the uv lockfile,
# web/'s package.json, and the workflow `uses:` refs that decision G pins to tags.
#
# Grouped so one pull request carries every minor and patch bump of an ecosystem.
# Ungrouped, a weekly run opens one PR per package and the noise is what gets the
# updates ignored. A major bump stays on its own PR: it is a decision, not a bump.
#
# Pinned by packages/helpdesk/tests/test_security_config.py::
# test_dependabot_declares_exactly_the_three_planned_ecosystems.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      web-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
