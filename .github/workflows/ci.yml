name: ci
on:
  pull_request:
  push:
    # Not on `dev`: pushes there run nothing, to save Actions minutes. `ci` runs
    # on the pull request from `dev` into `main` and after the merge, before
    # anything deploys.
    branches: [main]
jobs:
  # The checks that need no database: pre-commit, format, lint, types and the
  # policy engine's own 100% gate. Seconds, so a typo is red before the suite
  # has even started.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run pre-commit run --all-files
      - run: uv run ruff format --check .
      - run: make lint typecheck test-policy

  # The web gate on its own runner, pnpm pinned by `packageManager` in
  # web/package.json.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: make web-verify

  # The Python suite in three slices, one runner each, every runner with its
  # own compose Postgres, Redis and Qdrant. One runner took 16 minutes, and two
  # workers on one runner were slower still (its 2 CPUs are shared with the
  # services), so the split is across machines. `scripts/test_shard.py`
  # balances the files by `scripts/test_durations.json`; each slice keeps its
  # coverage data and the `coverage` job judges the floor on the whole.
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync
      # The same compose file as a laptop, so the app role init script runs
      # here too, with the placeholder credentials from .env.example.
      - name: Start the backing services
        run: |
          cp .env.example .env
          docker compose up -d --wait postgres redis qdrant
      - name: Run this slice
        env:
          COVERAGE_FILE: .coverage.shard${{ matrix.shard }}
        run: |
          uv run pytest -q $(uv run python scripts/test_shard.py --shard ${{ matrix.shard }} --of 3) \
            --cov=helpdesk --cov=agent_api --cov=mcp_server --cov-report= --cov-fail-under=0
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-shard${{ matrix.shard }}
          path: .coverage.shard${{ matrix.shard }}
          include-hidden-files: true
          if-no-files-found: error

  # The 80% floor, over all three slices together: one slice alone covers only
  # part of the code, so judging it per slice would fail every run.
  coverage:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-shard*
          merge-multiple: true
      - run: |
          uv run coverage combine .coverage.shard*
          uv run coverage report --fail-under=80

  # Four scanners, no compose stack, and no `needs:` — so this job runs beside
  # the others rather than behind them, and a red suite never hides a red scan.
  #
  # gitleaks and trivy run from their own pinned images rather than from an
  # action, because both need argument forms the actions do not pass through
  # (a config path plus history for one, two target files for the other).
  # Pinned by packages/helpdesk/tests/test_security_config.py.
  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # fetch-depth: 0 is the whole point of this job. The pre-commit hook
      # already reads the working tree; only full history finds a secret that
      # was committed and reverted.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --baseline-path excuses the nine findings that live only in history: the
      # renamed test constants, the web idempotency_key and .env.example's
      # placeholder, each against a commit no rename can reach. A baseline entry
      # is matched on every field including Commit, so a secret in a NEW commit
      # is never covered by it. Pinned by test_security_config.py::
      # test_the_gitleaks_step_passes_a_baseline_path.
      #
      # --redact is deliberately absent: it rewrites Match and Secret to
      # "REDACTED", and gitleaks compares both against the baseline, so the two
      # flags cannot both be on. Every baselined value is a fake test fixture or
      # a placeholder, so printing them costs nothing; a real secret would be a
      # NEW finding and must be readable to be fixed.
      - name: Secrets over the full history
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.3 \
            detect --source=/repo --config=/repo/.gitleaks.toml --no-banner \
            --baseline-path=/repo/.gitleaks-baseline.json

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      # --strict fails the job on an advisory with a fix available, which is the
      # only kind Dependabot can act on. No --ignore-vuln flag exists today; one
      # is added only with a comment carrying the reason and the date.
      # --no-emit-workspace drops the local `-e ./packages/...` lines, which
      # pip-audit cannot hash and which are this repo's own code anyway.
      - name: Python advisories
        run: |
          uv export --frozen --no-emit-project --no-emit-workspace --format requirements-txt \
            --output-file requirements-audit.txt
          uvx pip-audit --strict -r requirements-audit.txt

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Web advisories
        working-directory: web
        run: pnpm audit --audit-level high

      # Both compose files, because the override example is copied verbatim by
      # anyone running the stack locally. .trivyignore is empty at HEAD.
      - name: Compose configuration
        run: |
          docker run --rm -v "$PWD:/work" -w /work aquasec/trivy:0.58.1 \
            config --severity HIGH,CRITICAL --exit-code 1 --ignorefile .trivyignore \
            docker-compose.yml
          docker run --rm -v "$PWD:/work" -w /work aquasec/trivy:0.58.1 \
            config --severity HIGH,CRITICAL --exit-code 1 --ignorefile .trivyignore \
            docker-compose.override.example.yml
