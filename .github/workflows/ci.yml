name: ci
on:
  pull_request:
  push:
    # Not on `dev`: pushes there run nothing, to save Actions minutes. `ci` runs
    # on the pull request from `dev` into `main` and after the merge, before
    # anything deploys.
    branches: [main]
jobs:
  # The checks that need no database: pre-commit, format, lint, types and the
  # policy engine's own 100% gate. Seconds, so a typo is red before the suite
  # has even started.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --project backend
      - run: uv run --project backend pre-commit run --all-files
      - run: uv run --project backend ruff format --check --config backend/pyproject.toml .
      - run: make lint typecheck test-policy
      - name: Root allowlist
        run: python3 .github/scripts/check_root.py
      - name: Import contracts
        working-directory: backend
        run: uv run lint-imports

  # The web gate on its own runner, pnpm pinned by `packageManager` in
  # web/package.json.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: make web-verify

  # The Python suite in three slices, one runner each, every runner with its
  # own compose Postgres, Redis and Qdrant. One runner took 16 minutes, and two
  # workers on one runner were slower still (its 2 CPUs are shared with the
  # services), so the split is across machines. `.github/scripts/test_shard.py`
  # balances the files by `.github/scripts/test_durations.json`; each slice keeps its
  # coverage data and the `coverage` job judges the floor on the whole.
  tests:
    runs-on: ubuntu-latest
    # CI has no backend/.env.demo (it is gitignored), so the job sets the
    # values the app cannot start without. Each points at the port compose
    # publishes; the Postgres login is compose's own default.
    env:
      DATABASE_URL: postgresql+asyncpg://helpdesk:change-me@localhost:5432/helpdesk
      # The suite's own server (compose `postgres-test`); the tests point
      # DATABASE_URL here at import, so no test touches the app's roles.
      TEST_DATABASE_URL: postgresql+asyncpg://helpdesk:change-me@localhost:5433/helpdesk_test
      REDIS_URL: redis://localhost:6379/0
      QDRANT_URL: http://localhost:6333
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --project backend
      # A fresh random secret each run, so ci.yml holds no value for it.
      - name: Make a JWT secret for this run
        run: echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      # The same compose file as a laptop, so the app role init script runs
      # here too, with compose's own default credentials.
      # Compose reads both backend env files as optional; CI writes neither.
      - name: Start the backing services
        run: docker compose up -d --wait postgres postgres-test redis qdrant
      - name: Run this slice
        working-directory: backend
        env:
          COVERAGE_FILE: .coverage.shard${{ matrix.shard }}
          EVAL_ROUTES_ENABLED: "true"
        run: |
          uv run pytest -q $(uv run python ../.github/scripts/test_shard.py --shard ${{ matrix.shard }} --of 3) \
            --cov=helpdesk --cov-report= --cov-fail-under=0
      # The repo-level tests sit outside the backend project's test paths, so they
      # are not in any shard. Run them once (on shard 0) as their own pass, with the
      # repo root and backend both on the path. Static scans, no services.
      - name: Repo-level tests
        if: ${{ matrix.shard == 0 }}
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/backend
        run: uv run --project backend pytest -q infra/tests
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-shard${{ matrix.shard }}
          path: backend/.coverage.shard${{ matrix.shard }}
          include-hidden-files: true
          if-no-files-found: error

  # The 80% floor, over all three slices together: one slice alone covers only
  # part of the code, so judging it per slice would fail every run.
  coverage:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --project backend
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-shard*
          merge-multiple: true
          path: backend
      - name: Judge the floor
        working-directory: backend
        run: |
          uv run coverage combine .coverage.shard*
          uv run coverage report --fail-under=80

  # Four scanners, no compose stack, and no `needs:` — so this job runs beside
  # the others rather than behind them, and a red suite never hides a red scan.
  #
  # gitleaks and trivy run from their own pinned images rather than from an
  # action, because both need argument forms the actions do not pass through
  # (a config path plus history for one, two target files for the other).
  # Pinned by infra/tests/test_security_config.py.
  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # fetch-depth: 0 is the whole point of this job. The pre-commit hook
      # already reads the working tree; only full history finds a secret that
      # was committed and reverted.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # CI-only setup: uv, pnpm and node install the tools `make security` calls.
      # The scans themselves, their flags and versions live in the Makefile's
      # `security` target, so the laptop runs exactly what CI runs. Pinned by
      # test_security_config.py::test_the_security_job_runs_no_scanner_itself.
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Security scans
        run: make security
