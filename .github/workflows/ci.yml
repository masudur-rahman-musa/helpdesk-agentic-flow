name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run pre-commit run --all-files
      - run: make verify

  # Four scanners, no compose stack, and no `needs:` — so this job runs beside
  # `check` rather than behind it. That matters: `check` runs `make verify`,
  # which needs Postgres, Redis and Qdrant that CI does not have, so chaining
  # the security job behind it would make it unrunnable too.
  #
  # gitleaks and trivy run from their own pinned images rather than from an
  # action, because both need argument forms the actions do not pass through
  # (a config path plus history for one, two target files for the other).
  # Pinned by packages/helpdesk/tests/test_security_config.py.
  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # fetch-depth: 0 is the whole point of this job. The pre-commit hook
      # already reads the working tree; only full history finds a secret that
      # was committed and reverted.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --baseline-path excuses the nine findings that live only in history: the
      # renamed test constants, the web idempotency_key and .env.example's
      # placeholder, each against a commit no rename can reach. A baseline entry
      # is matched on every field including Commit, so a secret in a NEW commit
      # is never covered by it. Pinned by test_security_config.py::
      # test_the_gitleaks_step_passes_a_baseline_path.
      #
      # --redact is deliberately absent: it rewrites Match and Secret to
      # "REDACTED", and gitleaks compares both against the baseline, so the two
      # flags cannot both be on. Every baselined value is a fake test fixture or
      # a placeholder, so printing them costs nothing; a real secret would be a
      # NEW finding and must be readable to be fixed.
      - name: Secrets over the full history
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.3 \
            detect --source=/repo --config=/repo/.gitleaks.toml --no-banner \
            --baseline-path=/repo/.gitleaks-baseline.json

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      # --strict fails the job on an advisory with a fix available, which is the
      # only kind Dependabot can act on. No --ignore-vuln flag exists today; one
      # is added only with a comment carrying the reason and the date.
      # --no-emit-workspace drops the local `-e ./packages/...` lines, which
      # pip-audit cannot hash and which are this repo's own code anyway.
      - name: Python advisories
        run: |
          uv export --frozen --no-emit-project --no-emit-workspace --format requirements-txt \
            --output-file requirements-audit.txt
          uvx pip-audit --strict -r requirements-audit.txt

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Web advisories
        working-directory: web
        run: pnpm audit --audit-level high

      # Both compose files, because the override example is copied verbatim by
      # anyone running the stack locally. .trivyignore is empty at HEAD.
      - name: Compose configuration
        run: |
          docker run --rm -v "$PWD:/work" -w /work aquasec/trivy:0.58.1 \
            config --severity HIGH,CRITICAL --exit-code 1 --ignorefile .trivyignore \
            docker-compose.yml
          docker run --rm -v "$PWD:/work" -w /work aquasec/trivy:0.58.1 \
            config --severity HIGH,CRITICAL --exit-code 1 --ignorefile .trivyignore \
            docker-compose.override.example.yml
