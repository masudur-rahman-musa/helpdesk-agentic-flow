name: image-scan

# Weekly and on demand, never on a pull request. An
# upstream CVE published overnight would otherwise redden a PR that changed no
# code, and a gate that fails for reasons the author cannot act on is a gate the
# team learns to click past.
#
# --ignore-unfixed for the same reason from the other direction: every finding
# here has an upgrade available, so every red run has an action.
#
# Two jobs, because the images come from two places. `base` scans the three
# images docker-compose.yml pins: the demo stack ships them, so a fixable
# critical in the postgres we pin is our finding. `built` builds this
# repository's own four images and scans those, which an earlier change added with the
# Dockerfiles that make them buildable.
#
# Pinned by backend/tests/shared/test_security_config.py::
# test_the_image_scan_covers_exactly_the_three_pinned_compose_images and by
# backend/tests/shared/test_container_build.py::
# test_the_image_scan_job_covers_the_four_built_images.
on:
  schedule:
    # 04:00 UTC every Monday.
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Scan the pinned base images
        run: |
          for image in postgres:16.6-alpine redis:7.4-alpine qdrant/qdrant:v1.12.4; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              aquasec/trivy:0.58.1 image \
              --ignore-unfixed --severity HIGH,CRITICAL --exit-code 1 "$image"
          done

  built:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # The four builds are minutes, which is why they live here and not in
      # pytest: `test_container_build.py` proves the Dockerfiles' shape by
      # parsing them, and this job is the only place the images themselves are
      # ever produced in CI. A build that breaks is caught here as a red job,
      # not as a surprise at deploy time.
      - name: Build the four service images
        run: |
          docker build -f backend/Dockerfile.agent-api -t helpdesk-agent-api:scan backend
          docker build -f backend/Dockerfile.mcp-server -t helpdesk-mcp-server:scan backend
          docker build -f backend/Dockerfile.scheduler -t helpdesk-scheduler:scan backend
          docker build -t helpdesk-web:scan web

      - name: Scan the four built images
        run: |
          for image in helpdesk-agent-api helpdesk-mcp-server helpdesk-scheduler helpdesk-web; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              aquasec/trivy:0.58.1 image \
              --ignore-unfixed --severity HIGH,CRITICAL --exit-code 1 "$image:scan"
          done
