[project]
name = "agent-api"
version = "0.1.0"
description = "Helpdesk agent API service"
requires-python = ">=3.12"
dependencies = [
    "helpdesk",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "redis>=5.2",
    "qdrant-client>=1.12",
    # the design, an earlier change decision A: the agent turn is a LangGraph StateGraph.
    "langgraph>=1.2",
    # An earlier change decision B: the checkpoint tables are LangGraph's own, created
    # by the library's `setup()` from the migrate target, never hand-copied
    # into an Alembic revision that drifts on every library upgrade.
    "langgraph-checkpoint-postgres>=2.0",
    # An earlier change decision C: `langgraph-checkpoint-postgres` is psycopg3-only
    # while the rest of this repo is asyncpg, so psycopg is carried for the
    # checkpointer alone, with its own small pool. `pool` is the extra that
    # brings `psycopg_pool`, which the saver's async pool needs.
    "psycopg[binary,pool]>=3.2",
    # the design and §5, an earlier change decision A: the agent reaches the MCP server
    # over streamable HTTP with the official SDK's client, never a hand-rolled
    # JSON-RPC handshake against a server that already speaks the SDK's.
    "mcp>=2.1",
    # The SDK's client speaks httpx2, not httpx, so the floor is declared here
    # rather than inherited from whatever `mcp` happens to vendor; the root dev
    # group declares the same floor for the same reason.
    "httpx2>=2.12",
]

[build-system]
requires = ["uv_build>=0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "agent_api"
module-root = ""

[tool.uv.sources]
helpdesk = { workspace = true }
