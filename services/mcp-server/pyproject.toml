[project]
name = "mcp-server"
version = "0.1.0"
description = "Helpdesk MCP server"
requires-python = ">=3.12"
dependencies = [
    "helpdesk",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "mcp>=2.1",
]

[project.scripts]
helpdesk-mcp-stdio = "mcp_server.main:run_stdio"

[build-system]
requires = ["uv_build>=0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "mcp_server"
module-root = ""

[tool.uv.sources]
helpdesk = { workspace = true }
