# Copy to docker-compose.override.yml once; compose merges it automatically
# and the copy is gitignored. Two things live here: host ports remapped where
# they clash with something local, and watch mode for the four app services.
#
# Watch mode: `docker compose --profile app up -d` runs each app service from
# the source on this machine, so a saved file shows up with no rebuild. Only a
# dependency change (uv.lock, web/pnpm-lock.yaml) needs `--build`.
#
# Nothing here sets a credential or a hostname: those still come from .env and
# from docker-compose.yml. Pinned by infra/tests/
# test_container_build.py::test_the_override_example_sets_only_allowlisted_environment
# and ::test_the_override_example_adds_no_service_and_no_profile.
services:
  postgres:
    ports: ["55432:5432"]
  qdrant:
    ports: ["16333:6333"]

  # The Python services keep their production image and swap its entrypoint for
  # a reloading uvicorn. The one project is an editable install whose .pth file
  # points at /app, where the `helpdesk` package lives, so mounting the host
  # source read-only over /app/helpdesk is enough, and /app/.venv is never
  # shadowed (::test_the_override_example_never_mounts_over_the_venv).
  # watchfiles is not in the image, so uvicorn's --reload falls back to its
  # StatReload polling, which also works across a macOS bind mount.
  # Pinned by ::test_the_override_example_reloads_every_python_service and
  # ::test_the_override_example_mounts_python_source_read_only.
  helpdesk-agent-api:
    entrypoint: ["uvicorn", "helpdesk.agent_api.api.router:app", "--host", "0.0.0.0", "--port", "8000", "--reload",
                 "--reload-dir", "/app/helpdesk"]
    volumes:
      - "./backend/helpdesk:/app/helpdesk:ro"

  helpdesk-mcp-server:
    entrypoint: ["uvicorn", "helpdesk.mcp_server.main:app", "--host", "0.0.0.0", "--port", "8081", "--reload",
                 "--reload-dir", "/app/helpdesk"]
    volumes:
      - "./backend/helpdesk:/app/helpdesk:ro"

  helpdesk-scheduler:
    entrypoint: ["uvicorn", "helpdesk.scheduler.main:app", "--host", "0.0.0.0", "--port", "8082", "--reload",
                 "--reload-dir", "/app/helpdesk"]
    volumes:
      - "./backend/helpdesk:/app/helpdesk:ro"

  # The web runs `next dev` from the Dockerfile's `deps` stage, which already
  # holds pnpm and node_modules; `pull_policy: build` keeps compose from looking
  # for the local-only tag in a registry. The install on start is a no-op when
  # the lockfile is unchanged and heals a stale node_modules volume when it is
  # not. Polling, because file events across a macOS bind mount are not
  # reliable. The first dev compile of /healthz is slow, hence the start period;
  # the probe itself stays the base file's. The deps stage runs as root, which
  # is acceptable for a local dev container and never shipped.
  # Pinned by ::test_the_override_example_runs_web_in_dev_mode,
  # ::test_the_override_example_keeps_web_dependencies_in_named_volumes and
  # ::test_the_override_example_gives_web_a_start_period.
  helpdesk-web:
    build:
      context: web
      target: deps
    image: helpdesk-web:dev
    pull_policy: build
    command: ["sh", "-c", "pnpm install --frozen-lockfile && exec pnpm exec next dev -H 0.0.0.0 -p 3000"]
    environment:
      WATCHPACK_POLLING: "true"
    volumes:
      - "./web:/app"
      - "web-node-modules:/app/node_modules"
      - "web-next:/app/.next"
    healthcheck:
      start_period: 60s

volumes:
  web-node-modules:
  web-next:
