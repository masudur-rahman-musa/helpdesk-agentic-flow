# The Helpdesk's four workloads on the cluster: agent API, MCP tool server,
# scheduler and web front end, with their Services, `helpdesk-config` and the
# policies volume. Kept in this repo so it deploys itself.
#
# What this file relies on and does NOT create, all made by the console repo's
# deploy, which must have run first: the `apps` namespace and its quota, the
# `platform` Postgres, Redis and Qdrant, the `gateway`, the `helpdesk` Ingress and
# its NetworkPolicies, and the two Secrets `helpdesk-secrets` (database DSNs, the
# gateway keys, the JWT secret) and `ghcr-pull` (the read:packages token the four
# private images are pulled with).
#
# Memory stays inside the Helpdesk's share of the `apps` quota: 704Mi of requests
# and 1408Mi of limits across the four. No `limits.cpu`: a CPU limit throttles
# the agent-api, which carries a latency target.
#
# The scheduler has no ports and no probes: it serves nothing and runs jobs.
# There is no leader lock: each job takes its own Redis lock per tenant (one
# lock for a job that spans tenants), so `replicas: 1` with `Recreate` keeps
# exactly one copy and the per-job locks cover any brief overlap.
#
# Images are set by `kustomization.yaml`; a deploy job puts the commit SHA in.
apiVersion: v1
kind: ConfigMap
metadata:
  name: helpdesk-config
  namespace: apps
  labels:
    app.kubernetes.io/name: helpdesk
data:
  # In-cluster addresses, every host fully qualified: these pods are in `apps`
  # and two of the three services are in `platform`, so a bare `redis` resolves
  # to nothing.
  GATEWAY_URL: http://gateway.apps.svc.cluster.local:8080/v1
  # Redis database `1`, not the gateway's `0`. One Redis, two tenants of it, and
  # a shared index is one `FLUSHDB` away from taking out the other repo's state.
  REDIS_URL: redis://redis.platform.svc.cluster.local:6379/1
  QDRANT_URL: http://qdrant.platform.svc.cluster.local:6333
  ENV: production
  # The two internal Helpdesk endpoints, each on its own Service's port below.
  # The agent API calls the MCP server; the web pod calls the agent API from its
  # server side only, never from the browser.
  MCP_URL: http://helpdesk-mcp-server.apps.svc.cluster.local:8081/mcp
  AGENT_API_URL: http://helpdesk-agent-api.apps.svc.cluster.local:8000
  # The public address: the host of the console repo's `helpdesk` Ingress,
  # scheme and host only, no trailing slash.
  WEB_ORIGIN: https://helpdesk.example.com
  # The Host names the MCP transport accepts: agent-api dials the fully
  # qualified service name, which the default list lacks.
  MCP_ALLOWED_HOSTS: helpdesk-mcp-server.apps.svc.cluster.local:*,helpdesk-mcp-server:*
  # Quoted: a ConfigMap value is a string, and a bare `true` fails the apply.
  SESSION_COOKIE_SECURE: "true"
  # The corpus root the MCP server walks, as `{tenant}/{version}/{file}`. The
  # image carries no corpus: it reads the `helpdesk-policies` volume, read-only,
  # so a compromised tool process cannot edit what decides access. Load it once
  # before the first start.
  POLICY_DIR: /srv/policies
  # `OTEL_SERVICE_NAME` is deliberately NOT here. It is per-container
  # `env` below, because one trace carries spans from the Helpdesk and from the
  # gateway, and a shared name collapses four processes into one service in the
  # viewer - a failure no trace test would catch.
---
# The policy corpus the MCP server retrieves from, walked as
# `{tenant}/{version}/{file}`. It is a CLAIM and not a ConfigMap for two reasons:
# the corpus is the companion repo's data and belongs in neither this repo's git
# history nor its manifests, and a ConfigMap caps at 1Mi, which a real corpus
# outgrows without warning.
#
# Nothing here populates it. The owner loads the corpus once, then re-runs the
# companion repo's ingest against the same mount, so the volume and the vector
# store agree; `../README.md` carries the two commands. An empty claim is the
# honest failure: retrieval returns nothing, rather than the MCP server answering
# from a corpus nobody chose.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: helpdesk-policies
  namespace: apps
  labels:
    app.kubernetes.io/name: helpdesk
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 256Mi
  # `storageClassName` is deliberately absent: k3s defaults to `local-path`
  # and EKS to `gp2`, so one build deploys to both without leaving a Pending claim on a class that is not there.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: helpdesk-agent-api
  namespace: apps
  labels:
    app.kubernetes.io/name: helpdesk-agent-api
spec:
  replicas: 1
  # Stop the old pod before starting the new one: the `apps` quota on the 4 GB
  # node is full, and a pod started first is refused ("exceeded quota").
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: helpdesk-agent-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: helpdesk-agent-api
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: helpdesk-agent-api
          image: helpdesk-agent-api
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: helpdesk-config
            - secretRef:
                name: helpdesk-secrets
          env:
            - name: OTEL_SERVICE_NAME
              value: helpdesk-agent-api
          # `/readyz` is dependencies reachable and `/healthz` is process up.
          # Swapped, `/readyz` as liveness restarts the pod every time Redis
          # blips and `/healthz` as readiness sends traffic to a process with no
          # database.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
          # The reserve's own per-pod row: the one Helpdesk workload sized for
          # real traffic.
          resources:
            requests:
              memory: 192Mi
              cpu: 100m
            limits:
              memory: 384Mi
---
apiVersion: v1
kind: Service
metadata:
  name: helpdesk-agent-api
  namespace: apps
  labels:
    app.kubernetes.io/name: helpdesk-agent-api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: helpdesk-agent-api
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: helpdesk-mcp-server
  namespace: apps
  labels:
    app.kubernetes.io/name: helpdesk-mcp-server
spec:
  replicas: 1
  # Stop the old pod before starting the new one: the `apps` quota on the 4 GB
  # node is full, and a pod started first is refused ("exceeded quota").
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: helpdesk-mcp-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: helpdesk-mcp-server
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: helpdesk-mcp-server
          image: helpdesk-mcp-server
          ports:
            - name: http
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: helpdesk-config
            - secretRef:
                name: helpdesk-secrets
          env:
            - name: OTEL_SERVICE_NAME
              value: helpdesk-mcp-server
            # The two embedding models are built into the image (`build.yml`),
            # and `apps` has no route to the internet: never try to download.
            - name: HF_HUB_OFFLINE
              value: "1"
          # Read-only, and only here: `POLICY_DIR` is read by this workload and
          # by the ingest, and a corpus a tool process can WRITE is a corpus that
          # decides access and can be edited by whatever compromises that
          # process. The path is `helpdesk-config`'s `POLICY_DIR` value; the test
          # reads it off the built ConfigMap rather than repeating it.
          volumeMounts:
            - name: policies
              mountPath: /srv/policies
              readOnly: true
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              memory: 256Mi
              cpu: 75m
            limits:
              memory: 512Mi
      volumes:
        - name: policies
          persistentVolumeClaim:
            claimName: helpdesk-policies
---
apiVersion: v1
kind: Service
metadata:
  name: helpdesk-mcp-server
  namespace: apps
  labels:
    app.kubernetes.io/name: helpdesk-mcp-server
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: helpdesk-mcp-server
  ports:
    - name: http
      port: 8081
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: helpdesk-web
  namespace: apps
  labels:
    app.kubernetes.io/name: helpdesk-web
spec:
  replicas: 1
  # Stop the old pod before starting the new one: the `apps` quota on the 4 GB
  # node is full, and a pod started first is refused ("exceeded quota").
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: helpdesk-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: helpdesk-web
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: helpdesk-web
          image: helpdesk-web
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: helpdesk-config
            - secretRef:
                name: helpdesk-secrets
          env:
            - name: OTEL_SERVICE_NAME
              value: helpdesk-web
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              memory: 128Mi
              cpu: 75m
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: helpdesk-web
  namespace: apps
  labels:
    app.kubernetes.io/name: helpdesk-web
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: helpdesk-web
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: helpdesk-scheduler
  namespace: apps
  labels:
    app.kubernetes.io/name: helpdesk-scheduler
spec:
  replicas: 1
  # `Recreate`, not `RollingUpdate`: the rolling default starts the new pod
  # before the old one stops, which is two schedulers for the length of every
  # deploy. Each job takes its own Redis lock per tenant before it runs, and
  # every job is safe to run twice, which is what makes a brief second copy
  # survivable if one ever happens; it is not a reason to arrange for one.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: helpdesk-scheduler
  template:
    metadata:
      labels:
        app.kubernetes.io/name: helpdesk-scheduler
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: helpdesk-scheduler
          image: helpdesk-scheduler
          # No `ports`, no Service and no probes. It serves
          # nothing, so a Service in front of it would be an address with no
          # listener behind it.
          envFrom:
            - configMapRef:
                name: helpdesk-config
            - secretRef:
                name: helpdesk-secrets
          env:
            - name: OTEL_SERVICE_NAME
              value: helpdesk-scheduler
          resources:
            requests:
              memory: 128Mi
              cpu: 50m
            limits:
              memory: 256Mi
