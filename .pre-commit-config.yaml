repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-yaml
        # Kubernetes manifests hold several documents per file, split by `---`.
        args: [--allow-multiple-documents]
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: detect-private-key
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.3
    hooks:
      # --baseline-path is passed for the same reason the CI job passes it, plus
      # one the job does not have: gitleaks skips the baseline FILE only when the
      # flag names it (detect.go's fragment.FilePath check), so without this the
      # hook reads the baseline's own nine entries as ten fresh leaks and blocks
      # every commit. The hook's entry hardcodes --redact, which stops a baseline
      # ENTRY from matching, but the file skip is independent of that and still
      # engages. Pinned by test_security_config.py::
      # test_the_gitleaks_hook_and_the_ci_job_pass_the_same_baseline.
      - id: gitleaks
        args: [--baseline-path=.gitleaks-baseline.json]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      # The one ruff config lives in backend/; without --config, files outside
      # it (infra/tests, .github/scripts) get ruff's defaults. Pinned by
      # infra/tests/test_ruff_config.py.
      - id: ruff-format
        args: [--config, backend/pyproject.toml]
      - id: ruff-check
        args: [--config, backend/pyproject.toml]
  - repo: local
    hooks:
      # Keep the repo root to the names in .github/root-allowlist. Runs the full
      # scan (git ls-files) once per commit, so a stray top-level file is caught
      # here as well as by the CI lint job.
      - id: check-root
        name: root allowlist
        entry: python3 .github/scripts/check_root.py
        language: system
        pass_filenames: false
        always_run: true
